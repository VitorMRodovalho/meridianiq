name: Secret scan (gitleaks)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Weekly deep scan at 03:00 UTC Monday — catches anything that slipped in
    - cron: "0 3 * * 1"

# Least privilege for GITHUB_TOKEN (CodeQL actions/missing-workflow-permissions).
# `pull-requests: write` is REQUIRED — the action runs with
# GITLEAKS_ENABLE_COMMENTS=true and posts findings as PR comments.
# Dropping it to contents-only would silently disable that reporting.
permissions:
  contents: read
  pull-requests: write

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No GITLEAKS_LICENSE required — this is a public personal repo.
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: "true"
          GITLEAKS_ENABLE_SUMMARY: "true"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "true"
