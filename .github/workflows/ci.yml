name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: |
          pip install ruff
          ruff check src/ tests/ tools/
          ruff format --check src/ tests/ tools/

      - name: Canonical-hash byte-exact contract (ADR-0014)
        run: python -m pytest tests/test_canonical_hash.py -q --no-header --tb=short

      - name: Test
        run: python -m pytest tests/ -q --tb=short

  frontend:
    name: Frontend (SvelteKit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Type check
        run: npm run check

      # Runs the Vitest suite (incl. the i18n key-parity guard in
      # src/lib/i18n/parity.test.ts). Previously these unit tests ran only
      # locally and did not gate CI; the parity guard requires them to run here.
      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Run inside the official Playwright image so the browser binaries are
    # PRE-INSTALLED — this removes the `playwright install` download that
    # depends on the Playwright CDN (a sustained CDN/apt outage hung that step
    # across 6 CI runs, on a step that normally takes ~24s). The tag MUST match
    # the pinned @playwright/test version (web/package.json) so browser
    # revisions align.
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-jammy
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      # No `playwright install` step — the browsers ship pre-installed in the
      # container image above, so there is no CDN download that can stall CI.
      - name: Run E2E tests
        run: npx playwright test

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

  deploy-backend:
    name: Deploy API (Fly.io)
    needs: [backend, frontend, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: superfly/flyctl-actions/setup-flyctl@v1

      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  deploy-frontend:
    name: Deploy Web (Cloudflare Pages)
    needs: [backend, frontend, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install & Build
        run: |
          npm ci
          npm run build
          cp build/200.html build/index.html
        env:
          VITE_API_URL: https://meridianiq-api.fly.dev
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        env:
          # Stopgap: cloudflare/wrangler-action@v3.15.0 still uses
          # `using: node20` (verified 2026-05-09). GitHub deprecates Node 20
          # actions on 2026-06-02. Force Node 24 runtime until Cloudflare
          # ships a Node-24-native version of the action. Remove this env
          # block when wrangler-action declares `using: node24` upstream.
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy web/build --project-name=meridianiq --branch=main
