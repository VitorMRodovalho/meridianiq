name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege for GITHUB_TOKEN (CodeQL actions/missing-workflow-permissions).
# Every job here only reads the repo; the deploy jobs authenticate to Fly.io
# and Cloudflare with their own secrets, not GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: |
          pip install ruff
          ruff check src/ tests/ tools/
          ruff format --check src/ tests/ tools/

      - name: Canonical-hash byte-exact contract (ADR-0014)
        run: python -m pytest tests/test_canonical_hash.py -q --no-header --tb=short

      - name: Test
        run: python -m pytest tests/ -q --tb=short

  frontend:
    name: Frontend (SvelteKit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Type check
        run: npm run check

      # Runs the Vitest suite (incl. the i18n key-parity guard in
      # src/lib/i18n/parity.test.ts). Previously these unit tests ran only
      # locally and did not gate CI; the parity guard requires them to run here.
      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

  # Resolve the Playwright container tag FROM the lockfile so the image and
  # the installed @playwright/test can never drift apart. Previously the tag
  # was hardcoded: any Dependabot bump of @playwright/test (e.g. 1.61.1 ->
  # 1.62.1 in #212) left the image behind and every E2E test died with
  # "Executable doesn't exist at /ms-playwright/chromium_headless_shell-...".
  # `container.image` is resolved before the job's steps run, so the version
  # has to come from a preceding job's output.
  e2e-image:
    name: Resolve Playwright image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.resolve.outputs.image }}
    steps:
      - uses: actions/checkout@v7

      - name: Read @playwright/test version from lockfile
        id: resolve
        working-directory: web
        run: |
          version="$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")"
          if [ -z "$version" ] || [ "$version" = "undefined" ]; then
            echo "::error::Could not resolve @playwright/test version from web/package-lock.json"
            exit 1
          fi
          echo "Resolved @playwright/test $version"
          echo "image=mcr.microsoft.com/playwright:v${version}-jammy" >> "$GITHUB_OUTPUT"

  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [e2e-image]
    # Run inside the official Playwright image so the browser binaries are
    # PRE-INSTALLED — this removes the `playwright install` download that
    # depends on the Playwright CDN (a sustained CDN/apt outage hung that step
    # across 6 CI runs, on a step that normally takes ~24s). The tag is derived
    # from the lockfile by the `e2e-image` job above so browser revisions stay
    # aligned with @playwright/test automatically.
    container:
      image: ${{ needs.e2e-image.outputs.image }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      # No `playwright install` step — the browsers ship pre-installed in the
      # container image above, so there is no CDN download that can stall CI.
      - name: Run E2E tests
        run: npx playwright test

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

  deploy-backend:
    name: Deploy API (Fly.io)
    needs: [backend, frontend, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: superfly/flyctl-actions/setup-flyctl@v1

      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  deploy-frontend:
    name: Deploy Web (Cloudflare Pages)
    needs: [backend, frontend, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install & Build
        run: |
          npm ci
          npm run build
          cp build/200.html build/index.html
        env:
          VITE_API_URL: https://meridianiq-api.fly.dev
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        env:
          # Stopgap: cloudflare/wrangler-action@v3.15.0 still uses
          # `using: node20` (verified 2026-05-09). GitHub deprecates Node 20
          # actions on 2026-06-02. Force Node 24 runtime until Cloudflare
          # ships a Node-24-native version of the action. Remove this env
          # block when wrangler-action declares `using: node24` upstream.
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy web/build --project-name=meridianiq --branch=main
