version: 2

updates:
  # Python backend dependencies (pyproject.toml + uv.lock, ADR-0033). The
  # `uv` ecosystem updates the lock; the `pip` one would leave it stale, and
  # `uv sync --locked` fails CI and the image build on a stale lock.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 10
    # With a lock, a transitive dependency moves only when the lock is
    # regenerated, so version updates cover indirect dependencies too.
    allow:
      - dependency-type: "all"
    # An in-range release updates only uv.lock and leaves the ranges in
    # pyproject.toml alone; tests/test_dependency_caps.py matches the capped
    # ranges byte-exactly, so raising a floor there would fail the group.
    # A release outside a range still edits pyproject.toml, and a widened cap
    # still fails that test on purpose.
    versioning-strategy: "increase-if-necessary"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      # Keep patch/minor updates batched — less PR noise
      backend-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # Frontend dependencies (web/package.json)
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      svelte-ecosystem:
        patterns:
          - "svelte*"
          - "@sveltejs/*"
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
      frontend-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # The API image's Python base, pinned by digest in both Dockerfile stages
  # (ADR-0033 Amendment 2): a new digest arrives as a pull request, which runs
  # the image smoke. Only the `python` image: the uv image in the same file
  # moves with the `version` CI pins for setup-uv, which no updater touches,
  # so it stays a manual bump (#352). A new Python minor is a decision, not a
  # weekly update.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 2
    allow:
      - dependency-name: "python"
    ignore:
      - dependency-name: "python"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
    commit-message:
      prefix: "chore(docker)"

  # GitHub Actions workflow pins
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
