[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "meridianiq"
version = "4.3.0"
description = "The intelligence standard for project schedules — open-source schedule intelligence from validation to prediction"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [
    {name = "Vitor Maia Rodovalho", email = "vitor@vitormr.dev"},
]
keywords = ["primavera", "p6", "xer", "schedule", "cpm", "construction"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    # Upper bound pinned per ADR-0015 P2#9 (Wave 1 devils-advocate
    # follow-up): a silent 2.x-minor ``model_dump`` change would shift the
    # ADR-0014 byte-exact input_hash pins. Lock the minor range until a
    # conscious bump is audited against the pinned fixtures.
    # Floor bumped 2026-04-26: pydantic 2.13 audited against
    # tests/test_canonical_hash.py::TestByteExactPin (both minimal + rich
    # fixtures held). Safe within 2.x.
    # Floor bumped 2026-05-17 (Cycle 6 W1 Bucket B): pydantic 2.13.4
    # re-audited against TestByteExactPin + TestDeterminism + TestProjectScoping
    # + TestContentSensitivity + TestChainFilters + TestCanonicalJsonRules
    # (28/28 pass). No RootModel usage in src/ → 2.13.4 RootModel core-metadata
    # change is moot. Safe within 2.13.x.
    # Cap widened to ``<2.15`` 2026-10-30: pydantic 2.14.2 (pydantic-core
    # 2.50.2) re-audited against the same six classes (28/28 pass, both
    # TestByteExactPin digests unchanged), so stored ``input_hash`` values
    # stay readable. Safe within 2.14.x.
    #
    # Upper bound tightened to ``<2.14`` per Cycle 6 W1 exit-council DA
    # finding: a floor ``>=2.13.4,<3.0`` allows resolvers to pick 2.14+
    # silently — but the ADR-0014 byte-exact contract has only been
    # audited against 2.13.x. Tightening the cap converts a silent
    # serialization-drift risk into a Dependabot bump that forces a
    # conscious re-audit at every minor.
    "pydantic>=2.14.2,<2.15",
    "networkx>=3.7",
    "numpy>=2.5",
    "supabase>=2.33",
    "python-dotenv>=1.2.4",
    "python-multipart",
    "sentry-sdk[fastapi]>=2.73",
    "PyJWT[crypto]>=2.15.1",
    "defusedxml>=0.7",
]

[project.optional-dependencies]
api = ["fastapi>=0.162", "uvicorn[standard]>=0.54", "slowapi>=0.1.10", "psutil>=7.2"]
export = ["openpyxl>=3.1.5"]
reports = ["weasyprint>=70.0"]
# Upper bound: the AI gate classifies provider errors by their status code and
# response (src/api/ai_gate.py _outcome_of) and builds the client with
# max_retries/timeout; a major SDK release is a conscious bump. 1.x was
# audited: it moved to httpx2, so the client takes anthropic.Timeout, and
# tests/test_ai_gate.py builds the real client to catch that class of break.
# 2.x audited 2026-10-30 against the vendor's migration guide for API version
# 2026-10-21: it rejects temperature/top_p/top_k and document/citation blocks
# in the wrong role (none are sent here), sends the key as a bearer token, and
# keeps the four usage fields that cost_of reads. 2.x is Apache-2.0.
ai = ["anthropic>=2.3,<3"]
ml = ["scikit-learn>=1.9"]
# Upper bound per major: the server is written against one SDK major's
# public API. It was capped `<2` (ADR-0025) because 2.x renamed ``FastMCP``
# to ``MCPServer`` and dropped ``mcp.server.fastmcp``; ADR-0032 records the
# 2.x migration (the bind address moved from ``mcp.settings`` to run()).
# The next major is a conscious bump behind its own migration review.
mcp = ["mcp>=2.3,<3"]
dev = [
    "pytest>=9.2",
    "pytest-cov>=7.1",
    # Capped, not just `select`-pinned. The explicit `[tool.ruff.lint] select`
    # below stops NEW RULE FAMILIES from appearing on upgrade, but it does not
    # cover `ruff format`, whose style does change across minors and which CI
    # gates with `--check`; nor new rules landing inside an already-selected
    # family. Same "conscious bump" reasoning as `pydantic<2.15` / `mcp<3`.
    # 0.17.3 audited 2026-10-30: `check` and `format --check` clean, no edits.
    "ruff>=0.17.3,<0.18",
    "mypy>=2.4",
    "httpx>=0.28",
    "slowapi>=0.1.10",
    "psutil>=7.2",
    # The Excel paths (export/excel, export/aia-g703, the CBS cost upload) need
    # openpyxl. Without it here their tests skip, and a skip is how the image
    # shipped without it for months (#348).
    "openpyxl>=3.1.5",
    # Type stubs (Cycle 5 W4 hygiene). Reduces mypy --strict noise from
    # untyped third-party imports without per-module ``# type: ignore``
    # suppression.
    "types-networkx>=3.6.1.20261029",
    "types-openpyxl>=3.1.5.20261017",
    "types-defusedxml>=0.7.0.20260504",
]
all = ["meridianiq[api,export,reports,ai,ml,mcp,dev]"]

[tool.hatch.build.targets.wheel]
packages = ["src"]

# Build backends, pinned and hash-checked (ADR-0033 §Review 6). Two packages
# are built from source: this project (hatchling, plus `editables` for an
# editable install) and pyyaml 6.0.3, which has no cp315 wheel (setuptools +
# Cython). uv resolves their build environments outside the package list of
# uv.lock, so before this table each build took the newest release of each.
# The hashes are every file PyPI lists for the version; uv records them in
# uv.lock, and a download that matches none fails the build ("Hash mismatch").
# To update, regenerate with
#   uv pip compile <(printf 'hatchling\neditables\nsetuptools\nCython>=3.0\n') \
#     --python-version 3.15 --generate-hashes
